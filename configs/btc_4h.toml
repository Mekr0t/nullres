# BTC/USDT 4-hour — the same pipeline where the economics are friendlier.
#
# A 4h bar moves roughly twice as far as a 1h bar for the same fixed cost, so
# the same edge clears the spread far more comfortably. If a signal works at
# 1h it should work better here; if it ONLY works at 1h, be suspicious.

name = "btc_4h"
strategies = ["sma_cross", "donchian", "mean_reversion", "vol_target",
              "ml_direction", "ml_meta"]
out_dir = "reports"

# Rule parameters live here so a result can be reproduced from the config alone.
# These are the defaults the rules shipped with — they were NOT tuned, which is
# the only reason the donchian result was worth investigating.
# Parameter combinations explored before the run ledger existed: six configs
# x ~six strategies, two 25-cell sweeps, four robustness batteries, ablations
# and cost sweeps. Declaring it is what keeps `deflated_sharpe` honest -- the
# ledger cannot know about work it did not record.
prior_trials = 214

[params.donchian]
entry = 96
exit = 48

[params.sma_cross]
fast = 50
slow = 200

# Targets ~50% annualised vol against BTC's realised ~55-70%, so mean exposure
# lands near buy & hold's and the Sharpe comparison is like-for-like rather
# than a comparison of two different leverage levels.
[params.vol_target]
target = 0.50
vol_window = 30
band = 0.10
max_leverage = 1.0

[data]
symbol = "BTCUSDT"
interval = "4h"
start = "2020-01"
end = "2025-12"
cache_dir = "data"
source = "binance"

[label]
kind = "triple_barrier"
# Same reasoning as btc_1h, but 4h bars move ~2x as far for the same fixed
# cost, so break-even arrives in ~130 bars instead of ~500.
horizon = 126             # ~3 weeks
vol_window = 60
upper = 1.5
lower = 1.5

[split]
scheme = "expanding"
n_folds = 5
min_train = 3000
embargo = 126

[model]
kind = "hgb"
max_iter = 300
learning_rate = 0.05
max_depth = 4
l2 = 1.0
min_samples_leaf = 100
seed = 0

[cost]
fee_bps = 10.0
slippage_bps = 2.0

[sizing]
long_entry = 0.56
long_exit = 0.50
short_entry = 0.44
short_exit = 0.50
allow_short = true
min_hold = 84             # see `nullres budget --config configs/btc_4h.toml`
max_leverage = 1.0
vol_target = 0.0
