site_name: nullres
site_description: A quantitative research framework built to disprove trading strategies.
site_url: https://mekr0t.github.io/nullres/
repo_url: https://github.com/Mekr0t/nullres
repo_name: Mekr0t/nullres
edit_uri: edit/main/docs/

# README.md and RESEARCH.md stay at the repo root, where GitHub expects them,
# and are pulled in at build time by docs/hooks.py rather than copied. Two
# copies of a document that quotes measured figures is exactly the drift this
# project spends its time removing.
hooks:
  - docs/hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            heading_level: 3
            merge_init_into_class: true
            show_if_no_docstring: false
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md
  - Method:
      - The three rules: 00-the-rules.md
      - Research workflow: 01-workflow.md
      - Leakage catalogue: 02-leakage.md
      - Costs and execution: 03-costs.md
      - Labels and strategies: 04-labels-and-strategies.md
  - Results:
      - The measurements: research.md
      - The graveyard: 05-graveyard.md
  - API reference:
      - Overview: api/index.md
      - Commands: api/commands.md
      - Result types: api/results.md
      - Rendering: api/report.md
      - Errors: api/errors.md
      - Backtest core: api/core.md
      - Falsification: api/falsification.md
      - Data and features: api/data.md

watch:
  - nullres
  - README.md
  - RESEARCH.md
