[project]
name = "tbot"
version = "0.1.0"
description = "Honest research harness for systematic trading strategies"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "requests>=2.31",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
boost = ["lightgbm>=4.0"]
dev = ["pytest>=7.4"]

[project.scripts]
tbot = "tbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs (~1-2 min). Deselect with -m 'not slow'.",
]
