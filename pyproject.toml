[project]
name = "nullres"
version = "0.1.0"
description = "Honest research harness for systematic trading strategies"
# Matches the CI matrix exactly. It read ">=3.11" while nothing tested 3.11 —
# the code would very likely have run there (tomllib is its real syntactic
# floor), but "would very likely" is the kind of claim this repo refuses
# everywhere else, and requirements.txt pins exact dependency versions that
# were never resolved against it. Widen this only by adding the version to
# .github/workflows/ci.yml first; a test asserts the two agree.
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "requests>=2.31",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
boost = ["lightgbm>=4.0"]
dev = ["pytest>=7.4", "ruff>=0.6"]
# `mkdocs build --strict` is run in CI. The API reference is generated from the
# docstrings, so a function that loses its documentation shows up as a gap in
# the site rather than as nothing at all.
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[project.scripts]
nullres = "nullres.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nullres"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs (~1-2 min). Deselect with -m 'not slow'.",
]

[tool.ruff]
# 100, not the 88 default. The codebase wraps at ~79 by hand and only one line
# ever exceeded 100, so this catches the genuinely unreadable without demanding
# a reformat of thirty-odd legacy lines that are merely long.
line-length = 100

[tool.ruff.lint]
# E4/E7/E9 + F is ruff's default; W and E501 are the additions. Deliberately
# NOT enabled: I (import sorting) and UP/B/SIM, which between them want ~25
# changes across code this project has good reasons for. A lint config should
# describe what the tree already is, so a failure means something broke rather
# than something was never true.
select = ["E4", "E7", "E9", "F", "W", "E501"]
